<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Flatten Exercises — CNN to FFN Input Size</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: #0f172a;
    color: #e2e8f0;
    min-height: 100vh;
    padding: 1.5rem;
  }

  a { color: #818cf8; text-decoration: none; }
  a:hover { text-decoration: underline; }

  header { max-width: 960px; margin: 0 auto 1.5rem; }
  header .back { font-size: 0.85rem; color: #94a3b8; }

  h1 {
    text-align: center;
    font-size: 1.6rem;
    font-weight: 700;
    color: #f8fafc;
    margin: 0.5rem 0 0.3rem;
  }

  .subtitle {
    text-align: center;
    color: #94a3b8;
    font-size: 0.9rem;
    margin-bottom: 1.5rem;
    line-height: 1.5;
  }

  .problems {
    max-width: 960px;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    gap: 1.3rem;
  }

  .problem {
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 12px;
    padding: 1.2rem 1.5rem;
  }

  .problem h2 {
    font-size: 0.95rem;
    font-weight: 700;
    color: #f8fafc;
    margin-bottom: 0.5rem;
  }

  .pipeline {
    display: flex;
    gap: 0.6rem;
    align-items: center;
    flex-wrap: wrap;
    margin-bottom: 0.8rem;
  }

  .stage {
    text-align: center;
    padding: 0.4rem 0.7rem;
    border-radius: 8px;
    font-weight: 700;
    font-size: 0.82rem;
    line-height: 1.4;
  }

  .stage .stage-label {
    font-size: 0.62rem;
    font-weight: 400;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    display: block;
    margin-bottom: 0.1rem;
  }

  .stage.input   { background: #1e3a5f; color: #93c5fd; }
  .stage.conv    { background: #3b1f7e; color: #c4b5fd; }
  .stage.pool    { background: #4a1d42; color: #f9a8d4; }
  .stage.flatten { background: #164e63; color: #67e8f9; }
  .stage.output  { background: #064e3b; color: #6ee7b7; }

  .arrow {
    color: #475569;
    font-size: 1.2rem;
    flex-shrink: 0;
  }

  .answer-area {
    display: flex;
    align-items: center;
    gap: 1rem;
    flex-wrap: wrap;
  }

  .reveal-btn {
    padding: 0.5rem 1.2rem;
    border-radius: 8px;
    border: 1px solid #475569;
    background: #1e293b;
    color: #e2e8f0;
    font-size: 0.85rem;
    cursor: pointer;
    transition: background 0.15s, border-color 0.15s;
  }

  .reveal-btn:hover {
    background: #334155;
    border-color: #6366f1;
  }

  .answer-box { text-align: left; }

  .answer-box .final-value {
    font-size: 1.3rem;
    font-weight: 800;
    color: #10b981;
    padding: 0.35rem 0.8rem;
    background: #064e3b;
    border-radius: 8px;
    display: inline-block;
    font-family: 'Courier New', monospace;
  }

  .answer-box .work-steps {
    margin-top: 0.4rem;
    font-size: 0.75rem;
    color: #94a3b8;
    font-family: 'Courier New', monospace;
    line-height: 1.6;
  }

  .answer-box .work-steps .step-label {
    color: #64748b;
  }

  .answer-box .work-steps .step-result {
    color: #fbbf24;
  }

  .answer-box .work-steps .step-flatten {
    color: #67e8f9;
    font-weight: 700;
  }

  .hidden { display: none; }
</style>
</head>
<body>

<header>
  <a class="back" href="index.html">&larr; Back to Hub</a>
</header>

<h1>Flatten Exercises</h1>
<p class="subtitle">
  Each problem describes a CNN architecture. Track the tensor through each layer, then compute<br>
  how many values enter the fully-connected layer after flattening (H &times; W &times; C).<br>
  Convolution uses stride 1, no padding. Pooling stride = pool size.
</p>

<div class="problems" id="problems"></div>

<script>
(() => {
  const problems = [
    {
      title: 'Problem 1 \u2014 Single conv layer',
      inputH: 8, inputW: 8, inputC: 1,
      stages: [
        { type: 'conv', kern: 3, filters: 4 }
      ]
    },
    {
      title: 'Problem 2 \u2014 Conv then pool',
      inputH: 8, inputW: 8, inputC: 1,
      stages: [
        { type: 'conv', kern: 3, filters: 4 },
        { type: 'pool', size: 2 }
      ]
    },
    {
      title: 'Problem 3 \u2014 MNIST-style input',
      inputH: 28, inputW: 28, inputC: 1,
      stages: [
        { type: 'conv', kern: 5, filters: 6 },
        { type: 'pool', size: 2 }
      ]
    },
    {
      title: 'Problem 4 \u2014 RGB input (CIFAR-style)',
      inputH: 32, inputW: 32, inputC: 3,
      stages: [
        { type: 'conv', kern: 3, filters: 16 },
        { type: 'pool', size: 2 }
      ]
    },
    {
      title: 'Problem 5 \u2014 Two conv + pool blocks',
      inputH: 32, inputW: 32, inputC: 3,
      stages: [
        { type: 'conv', kern: 3, filters: 16 },
        { type: 'pool', size: 2 },
        { type: 'conv', kern: 3, filters: 32 },
        { type: 'pool', size: 2 }
      ]
    },
    {
      title: 'Problem 6 \u2014 LeNet-style architecture',
      inputH: 28, inputW: 28, inputC: 1,
      stages: [
        { type: 'conv', kern: 5, filters: 6 },
        { type: 'pool', size: 2 },
        { type: 'conv', kern: 5, filters: 16 },
        { type: 'pool', size: 2 }
      ]
    },
    {
      title: 'Problem 7 \u2014 Three conv + pool blocks',
      inputH: 32, inputW: 32, inputC: 3,
      stages: [
        { type: 'conv', kern: 3, filters: 16 },
        { type: 'pool', size: 2 },
        { type: 'conv', kern: 3, filters: 32 },
        { type: 'pool', size: 2 },
        { type: 'conv', kern: 3, filters: 64 },
        { type: 'pool', size: 2 }
      ]
    },
    {
      title: 'Problem 8 \u2014 Large kernel, big tensor',
      inputH: 64, inputW: 64, inputC: 3,
      stages: [
        { type: 'conv', kern: 7, filters: 32 },
        { type: 'pool', size: 2 }
      ]
    },
    {
      title: 'Problem 9 \u2014 Non-square input',
      inputH: 48, inputW: 64, inputC: 3,
      stages: [
        { type: 'conv', kern: 5, filters: 16 },
        { type: 'pool', size: 2 },
        { type: 'conv', kern: 3, filters: 32 },
        { type: 'pool', size: 2 }
      ]
    },
    {
      title: 'Problem 10 \u2014 ImageNet-scale first block',
      inputH: 224, inputW: 224, inputC: 3,
      stages: [
        { type: 'conv', kern: 7, filters: 64 },
        { type: 'pool', size: 2 },
        { type: 'conv', kern: 3, filters: 128 },
        { type: 'pool', size: 2 }
      ]
    }
  ];

  function solve(prob) {
    let h = prob.inputH, w = prob.inputW, c = prob.inputC;
    const steps = [];
    steps.push({ label: 'Input', h, w, c });

    for (const stage of prob.stages) {
      if (stage.type === 'conv') {
        h = h - stage.kern + 1;
        w = w - stage.kern + 1;
        c = stage.filters;
        steps.push({ label: `Conv ${stage.kern}\u00d7${stage.kern}, ${stage.filters}f`, h, w, c });
      } else if (stage.type === 'pool') {
        h = Math.floor(h / stage.size);
        w = Math.floor(w / stage.size);
        steps.push({ label: `Pool ${stage.size}\u00d7${stage.size}`, h, w, c });
      }
    }

    const flatLen = h * w * c;
    steps.push({ label: 'Flatten', h, w, c, flat: flatLen });
    return { h, w, c, flatLen, steps };
  }

  const container = document.getElementById('problems');

  problems.forEach((prob, idx) => {
    const result = solve(prob);

    // Build pipeline badges
    let pipeHTML = '';
    pipeHTML += `<div class="stage input"><span class="stage-label">Input</span>${prob.inputH}\u00d7${prob.inputW}\u00d7${prob.inputC}</div>`;

    for (const stage of prob.stages) {
      pipeHTML += '<span class="arrow">&rarr;</span>';
      if (stage.type === 'conv') {
        pipeHTML += `<div class="stage conv"><span class="stage-label">Conv</span>${stage.kern}\u00d7${stage.kern}, ${stage.filters} filters</div>`;
      } else {
        pipeHTML += `<div class="stage pool"><span class="stage-label">Max Pool</span>${stage.size}\u00d7${stage.size}</div>`;
      }
    }

    pipeHTML += '<span class="arrow">&rarr;</span>';
    pipeHTML += '<div class="stage flatten"><span class="stage-label">Flatten</span>H\u00d7W\u00d7C</div>';
    pipeHTML += '<span class="arrow">&rarr;</span>';
    pipeHTML += '<div class="stage output"><span class="stage-label">FFN Input</span>? values</div>';

    // Build work steps
    let workHTML = '';
    for (let i = 0; i < result.steps.length; i++) {
      const s = result.steps[i];
      if (i === 0) {
        workHTML += `<div><span class="step-label">${s.label}:</span> <span class="step-result">${s.h}\u00d7${s.w}\u00d7${s.c}</span></div>`;
      } else if (s.flat !== undefined) {
        workHTML += `<div><span class="step-label">${s.label}:</span> <span class="step-flatten">${s.h} \u00d7 ${s.w} \u00d7 ${s.c} = ${s.flat.toLocaleString()}</span></div>`;
      } else {
        const prev = result.steps[i - 1];
        workHTML += `<div><span class="step-label">${s.label}:</span> <span class="step-result">${prev.h}\u00d7${prev.w}\u00d7${prev.c} \u2192 ${s.h}\u00d7${s.w}\u00d7${s.c}</span></div>`;
      }
    }

    const el = document.createElement('div');
    el.className = 'problem';
    el.innerHTML = `
      <h2>${prob.title}</h2>
      <div class="pipeline">${pipeHTML}</div>
      <div class="answer-area">
        <button class="reveal-btn" data-idx="${idx}">Reveal Answer</button>
        <div class="answer-box hidden" id="answer-${idx}">
          <span class="final-value">${result.flatLen.toLocaleString()} values</span>
          <div class="work-steps">${workHTML}</div>
        </div>
      </div>
    `;
    container.appendChild(el);
  });

  document.addEventListener('click', e => {
    const btn = e.target.closest('.reveal-btn');
    if (!btn) return;
    document.getElementById(`answer-${btn.dataset.idx}`).classList.remove('hidden');
    btn.classList.add('hidden');
  });
})();
</script>
</body>
</html>
